name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时一次（UTC）
  workflow_dispatch:        # 支持手动点运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync from cluntop/tvbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/cluntop/tvbox.git
          git fetch upstream

          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Auto sync from cluntop/tvbox"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main